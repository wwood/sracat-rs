[workspace]
authors = ["Ben Woodcroft <benjwoodcroft@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "sracat-rs"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build = "cargo build --release"
# Self-contained release binary: static-link ncbi-vdb so there is no
# libncbi-vdb.so / conda-path runtime dependency (for cargo-dist etc.).
build-static = { cmd = "cargo build --release", env = { SRACAT_VDB_LINK = "static" } }
sracat-rs = "cargo run --release --"

[dependencies]
ncbi-vdb = "==3.4.1"
c-compiler = ">=1.11.0,<2"
zlib = ">=1.3.2,<2"
sra-tools = ">=3.4.1,<4"
rust = ">=1.96.0,<1.97"

[feature.dev.dependencies]
snakemake = ">=9.23.1,<10"

[feature.dev.tasks]
fetch-testdata = "snakemake --cores 1"
test = { cmd = "cargo test", depends-on = ["fetch-testdata"] }
# Submit the benchmark sweep to the queue. Fetch the inputs first with
# `pixi run -e download download` (benchmarking/Snakefile) — they are large SRA
# runs downloaded via kingfisher into benchmarking/data, kept out of this task
# because that env needs a newer ncbi-vdb that conflicts with the default.
big_benchmark = { cmd = "mqsub --seg -t 8 -m 16 --hours 6 -- pixi run --manifest-path benchmarking/pixi.toml bench" }

[environments]
dev = ["dev"]
